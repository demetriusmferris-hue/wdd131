<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | WDD 131</title>
    <meta name="description" content="Share your experience with a product by submitting a product review.">
    <meta name="author" content="Demetrious Ferris">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/products.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header class="site-header">
        <p class="site-name">Product Feedback</p>
    </header>
    <main>
        <section class="form-card" aria-labelledby="page-title">
            <p class="eyebrow">Your experience matters</p>
            <h1 id="page-title">Product Review</h1>
            <p class="intro">Let us know how your product is working for you. All marked fields must be completed.</p>

            <form method="get" action="review.html">
                <div class="form-field">
                    <label for="product">Product Name <span class="required-note">(required)</span></label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="rating-field">
                    <legend>Overall Rating <span class="required-note">(required)</span></legend>
                    <p class="field-hint" id="rating-hint">Choose one rating from 1 to 5 stars.</p>
                    <div class="rating-options" aria-describedby="rating-hint">
                        <label class="rating-option" for="rating-1">
                            <input id="rating-1" name="rating" type="radio" value="1" required>
                            <span aria-hidden="true">&star;</span><span class="visually-hidden">1 star</span>
                        </label>
                        <label class="rating-option" for="rating-2">
                            <input id="rating-2" name="rating" type="radio" value="2" required>
                            <span aria-hidden="true">&star;&star;</span><span class="visually-hidden">2 stars</span>
                        </label>
                        <label class="rating-option" for="rating-3">
                            <input id="rating-3" name="rating" type="radio" value="3" required>
                            <span aria-hidden="true">&star;&star;&star;</span><span class="visually-hidden">3 stars</span>
                        </label>
                        <label class="rating-option" for="rating-4">
                            <input id="rating-4" name="rating" type="radio" value="4" required>
                            <span aria-hidden="true">&star;&star;&star;&star;</span><span class="visually-hidden">4 stars</span>
                        </label>
                        <label class="rating-option" for="rating-5">
                            <input id="rating-5" name="rating" type="radio" value="5" required>
                            <span aria-hidden="true">&star;&star;&star;&star;&star;</span><span class="visually-hidden">5 stars</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label for="installation-date">Date of Installation <span class="required-note">(required)</span></label>
                    <input id="installation-date" name="installation-date" type="date" required>
                </div>

                <fieldset class="features-field">
                    <legend>Useful Features <span class="optional-note">(check all that apply)</span></legend>
                    <div class="checkbox-options">
                        <label for="feature-efficiency">
                            <input id="feature-efficiency" name="features" type="checkbox" value="Energy efficiency">
                            Energy efficiency
                        </label>
                        <label for="feature-reliability">
                            <input id="feature-reliability" name="features" type="checkbox" value="Reliability">
                            Reliability
                        </label>
                        <label for="feature-ease">
                            <input id="feature-ease" name="features" type="checkbox" value="Ease of use">
                            Ease of use
                        </label>
                        <label for="feature-durability">
                            <input id="feature-durability" name="features" type="checkbox" value="Durability">
                            Durability
                        </label>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label for="written-review">Written Review <span class="optional-note">(optional)</span></label>
                    <textarea id="written-review" name="written-review" rows="5"></textarea>
                </div>

                <div class="form-field">
                    <label for="user-name">Your Name <span class="optional-note">(optional)</span></label>
                    <input id="user-name" name="user-name" type="text" autocomplete="name">
                </div>

                <input class="submit-button" type="submit" value="Submit Review">
            </form>
        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> | Demetrious Ferris | Hawaii | United States</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
